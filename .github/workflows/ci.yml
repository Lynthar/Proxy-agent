name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck lib/ and tests/
        # lib/ and tests/ are small and tractable — block on errors.
        run: |
          shellcheck --version
          shellcheck --severity=error --shell=bash \
            lib/*.sh tests/*.sh tests/e2e/*.sh

      - name: shellcheck install.sh
        # The legacy error backlog is cleared (0 errors since 2026-08); keep it
        # that way — this step blocks so regressions can't ride a soft gate.
        run: |
          shellcheck --severity=error --shell=bash install.sh

  tests:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: module unit tests
        run: bash tests/test_modules.sh

      - name: integration tests (mocked VPS tree)
        run: bash tests/test_integration.sh

      - name: library loading without host actions
        run: bash tests/test_library.sh

  tests-jq16:
    # Debian 12 and Ubuntu 22.04 ship jq 1.6, ubuntu-latest has 1.7. Filters that
    # only 1.7 accepts (a keyword as a variable name, `if` without `else`, pick,
    # abs, ...) pass the job above and break on those systems.
    name: unit + integration tests on jq 1.6 (Debian 12)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: install jq, openssl and procps
        run: |
          apt-get update && apt-get install -y --no-install-recommends jq openssl procps
          jq --version

      - name: module unit tests
        run: bash tests/test_modules.sh

      - name: integration tests (mocked VPS tree)
        run: bash tests/test_integration.sh

      - name: library loading without host actions
        run: bash tests/test_library.sh

  lang-parity:
    name: bilingual MSG_ key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: diff keys between zh_CN and en_US
        run: |
          zh=$(mktemp) ; en=$(mktemp)
          grep -oE '^MSG_[A-Z0-9_]+=' shell/lang/zh_CN.sh | sed 's/=$//' | sort -u > "$zh"
          grep -oE '^MSG_[A-Z0-9_]+=' shell/lang/en_US.sh | sed 's/=$//' | sort -u > "$en"
          if ! diff -u "$zh" "$en"; then
            echo "::error::MSG_ keys differ between shell/lang/zh_CN.sh and shell/lang/en_US.sh"
            echo "left = zh_CN, right = en_US. Keep them in sync."
            exit 1
          fi
          echo "OK: $(wc -l < "$zh") keys match."

      - name: no duplicate MSG_ keys within one language file
        # Bash "last definition wins" makes duplicates silently shadow earlier
        # values — translators can't tell which value is live.
        run: |
          status=0
          for f in shell/lang/zh_CN.sh shell/lang/en_US.sh; do
            dups=$(grep -oE '^MSG_[A-Z0-9_]+=' "$f" | sort | uniq -d)
            if [[ -n "$dups" ]]; then
              echo "::error::duplicate MSG_ keys in $f:"
              echo "$dups" | sed 's/=$//;s/^/  - /'
              status=1
            fi
          done
          exit "$status"

      - name: every t() call resolves to a real MSG_ key
        # Guards against two mistakes that the parity job above misses:
        #   1) `t MSG_FOO` — t() prepends MSG_ itself, so this looks up
        #      MSG_MSG_FOO and silently falls back to printing the raw key.
        #   2) `t TYPO` — passes a key that exists in neither lang file.
        # Both render the literal key to users (e.g. "23.MSG_MENU_DOCTOR"
        # in the main menu, every doctor section header, the dry-run
        # banner, plan-mode descriptions, ...).
        #
        # Match form is `$(t KEY ...)` — the only way t() is actually
        # invoked. A loose `\bt KEY` regex would false-positive on
        # things like `qrencode -t UTF8` and example snippets in
        # comments.
        run: |
          keys=$(mktemp)
          calls=$(mktemp)
          grep -oE '^MSG_[A-Z0-9_]+=' shell/lang/zh_CN.sh | sed 's/^MSG_//;s/=$//' | sort -u > "$keys"
          # Strip full-line comments first so docstring usage examples
          # like `#   $(t ERR_PORT_OCCUPIED "${port}")` don't false-fire.
          # Match `$(t KEY` and `$(t "KEY` — both forms are documented
          # in lib/i18n.sh; bare form is what the codebase actually uses.
          sed -E '/^[[:space:]]*#/d' install.sh lib/*.sh \
            | grep -oE '\$\(t "?[A-Z][A-Z0-9_]+' \
            | sed -E 's/^\$\(t "?//' | sort -u > "$calls"
          missing=$(comm -23 "$calls" "$keys" || true)
          if [[ -n "$missing" ]]; then
            echo "::error::t() called with keys that have no MSG_<key> definition:"
            echo "$missing" | sed 's/^/  - /'
            echo
            echo "Either the key is misspelled, or 't MSG_FOO' was used"
            echo "(t() prepends MSG_ itself — pass the suffix only)."
            exit 1
          fi
          echo "OK: all $(wc -l < "$calls") distinct t() keys resolve."

  syntax:
    name: bash -n syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check all shell scripts
        run: |
          set -e
          bash -n install.sh
          for f in lib/*.sh shell/lang/*.sh tests/*.sh tests/e2e/*.sh; do
            bash -n "$f"
          done

  install-e2e:
    name: real ${{ matrix.core }} install in a ${{ matrix.os }} container, ${{ matrix.client == 'same' && matrix.core || matrix.client }} client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [alpine, debian]
        core: [xray, singbox]
        # `same` = handshake with the core that was just installed. The include below
        # only becomes a fifth cell because its `client` conflicts with this value;
        # without the axis it would merge into the debian/xray cell and replace it.
        client: [same]
        # Cross leg: the sing-box subscriptions this script emits must complete the
        # Reality handshake against the Xray-core it installs.
        include:
          - os: debian
            core: xray
            client: singbox
    steps:
      - uses: actions/checkout@v4

      - name: run the Reality quick install end to end
        # Root in a throwaway container: real downloads and service manager, then the
        # core's own config check, a real Reality handshake through the emitted share link,
        # pasly re-entry, doctor and uninstall. tests/e2e/run.sh is the same command locally.
        run: bash tests/e2e/run.sh ${{ matrix.os }} ${{ matrix.core }} ${{ matrix.client == 'same' && matrix.core || matrix.client }}

  chain-e2e:
    name: carpool and a chain proxy together on two real containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: entry with carpool joins and leaves a chain to an Xray exit
        # Two Debian containers on one docker network. Fails unless the exit really forwarded
        # the traffic and carpool survives the chain going up and down.
        run: bash tests/e2e/run.sh chain xray
